# AniTails — autologin the unprivileged live user on VT1.
#
# GDM used to do this (and dragged in GNOME Shell). With the Hyprland/HyDE
# desktop there is no display manager: getty autologins `amnesia`, the login
# shell is replaced by /etc/profile.d/99-anitails-session.sh and Hyprland is
# started through uwsm.
#
# Security notes:
#   * never root: `--autologin amnesia` only, and `amnesia` is not in `wheel`
#   * the TTY is cleared afterwards so the previous session leaves no scrollback
#   * if the graphical session is not started, this is still just a login shell
#     for the unprivileged live user (root has a locked password)
[Service]
Type=simple
ExecStart=
ExecStart=-/usr/bin/agetty --autologin amnesia --noclear 38400 tty1
TTYReset=yes
TTYVHangup=yes
TTYVTDisallocate=yes
