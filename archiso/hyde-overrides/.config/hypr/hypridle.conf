# AniTails idle policy — derived from HyDE's hypridle.conf.
#
# Differences from upstream HyDE:
#   * No lock listener. The live user `amnesia` has a locked password and
#     AniTails forbids passwordless sudo, so `loginctl lock-session` would
#     produce a screen nobody can unlock (Tails disables screen locking too).
#   * No suspend listener. `sleep.conf.d/90-disable-sleep.conf` and the masked
#     swap unit mean the system never suspends or hibernates; RAM is only ever
#     wiped on shutdown/USB removal, so suspending would keep secrets resident.
#   * Only dim + DPMS off remain, both fully reversible on input.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    inhibit_sleep = 0
}

# --- Dim the panel after 60s ------------------------------------------------
listener {
    timeout = 60
    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume = brightnessctl -r
}

# --- Turn the panel off after 300s, wake on input ---------------------------
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
